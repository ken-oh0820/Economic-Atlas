name: Update Company Financials

on:
  schedule:
    - cron: '35 9 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-financials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build financial statements from official SEC bulk data
        env:
          SEC_USER_AGENT: EconomicDashboard 255784721+ken-oh0820@users.noreply.github.com
        run: python scripts/update-company-financials.py
      - name: Publish financial statements
        run: |
          git add data/companies
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SEC company financials"
          git pull --rebase origin main
          git push
