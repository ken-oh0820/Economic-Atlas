name: Update Company Financials

on:
  schedule:
    - cron: '35 9 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-financials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh company financials
        run: node scripts/update-company-financials.mjs
      - name: Publish financial statements
        run: |
          git add data/company-financials
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update company financials"
          git pull --rebase origin main
          git push
