name: Update Treasury Basis and Mortgage Data

on:
  schedule:
    - cron: '17 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-basis-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official Treasury basis and mortgage data
        run: node scripts/update-treasury-basis.mjs
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/treasury-basis.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury-basis.json
          git commit -m "Update Treasury basis risk data"
          git pull --rebase origin main
          git push
